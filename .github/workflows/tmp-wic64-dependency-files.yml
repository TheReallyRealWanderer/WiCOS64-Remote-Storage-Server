name: Temporary WiC64 dependency file export

on:
  push:
    branches:
      - tmp/wic64-build-1a-20260805
    paths:
      - .tmp-wic64-dependency-files-trigger

permissions:
  contents: read

jobs:
  export-files:
    runs-on: ubuntu-latest
    steps:
      - name: Export exact ESP-IDF 4.4.8 and Arduino-ESP32 files
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/espressif/esp-idf.git idf
          git -C idf checkout v4.4.8 -- \
            components/wpa_supplicant/esp_supplicant/src/esp_wps.c \
            components/wpa_supplicant/src/wps/wps.c \
            components/wpa_supplicant/src/wps/wps.h

          git clone --filter=blob:none --no-checkout https://github.com/espressif/arduino-esp32.git arduino
          git -C arduino checkout 213f9769ab21c68e3434e8e9037859de0cfc6441 -- \
            libraries/WiFi/src/WiFiGeneric.cpp

          tar -czf dependency-files.tar.gz \
            idf/components/wpa_supplicant/esp_supplicant/src/esp_wps.c \
            idf/components/wpa_supplicant/src/wps/wps.c \
            idf/components/wpa_supplicant/src/wps/wps.h \
            arduino/libraries/WiFi/src/WiFiGeneric.cpp
          sha256sum dependency-files.tar.gz | tee dependency-files-sha256.txt

      - name: Upload dependency files
        uses: actions/upload-artifact@v4
        with:
          name: wic64-build1a-dependency-files
          path: |
            dependency-files.tar.gz
            dependency-files-sha256.txt
          if-no-files-found: error
          retention-days: 1
